apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAegisContainerSecurity
metadata:
  name: aegis-unified-container-security
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - aegis-unified-policy
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAegisImageIntegrity
metadata:
  name: aegis-unified-image-integrity
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - aegis-unified-policy

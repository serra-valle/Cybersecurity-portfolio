apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-soar
  namespace: aegis-soar-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-soar-pod-response
  namespace: aegis-policy-test
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegis-soar-pod-response
  namespace: aegis-policy-test
subjects:
  - kind: ServiceAccount
    name: aegis-soar
    namespace: aegis-soar-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegis-soar-pod-response
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-soar-pod-response
  namespace: aegis-unified-policy
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegis-soar-pod-response
  namespace: aegis-unified-policy
subjects:
  - kind: ServiceAccount
    name: aegis-soar
    namespace: aegis-soar-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegis-soar-pod-response

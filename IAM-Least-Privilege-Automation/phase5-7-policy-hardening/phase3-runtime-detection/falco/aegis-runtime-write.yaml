- rule: Aegis Test Pod Write Below Etc
  desc: Detect write-open events under /etc from the Aegis Phase 3 test pod.
  condition: >
    evt.type in (open, openat, openat2)
    and evt.is_open_write=true
    and fd.typechar='f'
    and fd.num>=0
    and fd.name startswith /etc/
    and k8s.ns.name = "aegis-policy-test"
    and (k8s.pod.name = "falco-runtime-test" or k8s.pod.name = "falco-runtime-test-active")
  output: "Aegis test pod wrote below /etc | file=%fd.name user=%user.name uid=%user.uid process=%proc.name command=%proc.cmdline container=%container.name pod=%k8s.pod.name namespace=%k8s.ns.name"
  priority: WARNING
  tags: [aegis, filesystem, container, mitre_persistence]

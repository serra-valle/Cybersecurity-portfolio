name: Aegis Phase 4 Validation

on:
  pull_request:
    branches:
      - aegis-phase3-wazuh-integration-20261016
    paths:
      - "IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops/**"
      - ".github/workflows/aegis-phase4-ci.yml"
  push:
    branches:
      - aegis-phase4-soar-gitops-20261112
    paths:
      - "IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops/**"
      - ".github/workflows/aegis-phase4-ci.yml"

permissions:
  contents: read

jobs:
  source-validation:
    name: Python, OPA and Falco validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kubectl for Kustomize validation
        run: |
          set -euo pipefail
          curl -fsSLO https://dl.k8s.io/release/v1.33.4/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Python dependencies
        working-directory: IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt -r collectors/requirements.txt
          python -m pip check
          python -c "from importlib.metadata import version; v=tuple(int(x) for x in version('starlette').split('.')[:3]); assert v >= (1, 3, 1), v"

      - name: Run SOAR and collector unit tests
        working-directory: IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops
        env:
          PYTHONPATH: app:.
        run: |
          set -euo pipefail
          python -m compileall -q app collectors wazuh/active-response
          python -m unittest discover -s app/tests -v
          python -m unittest discover -s collectors/tests -v
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in (
              "wazuh/manager/aegis-gatekeeper-rules.xml",
              "wazuh/manager/ossec.conf-aegis-active-response.xml",
              "wazuh/agent/aegis-gatekeeper-localfile.xml",
          ):
              ET.parse(path)
              print(f"XML OK: {path}")
          PY

      - name: Install OPA 0.62.1
        run: |
          set -euo pipefail
          curl -fsSL https://openpolicyagent.org/downloads/v0.62.1/opa_linux_amd64_static -o opa
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Run Aegis Rego regression
        run: |
          set -euo pipefail
          POLICY_DIR=IAM-Least-Privilege-Automation/phase5-7-policy-hardening
          opa test -v \
            "$POLICY_DIR/aegis_guardrail_v8.rego" \
            "$POLICY_DIR/aegis_guardrail_v8_test.rego"

      - name: Validate Phase 4 Falco rule
        working-directory: IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /usr/bin/falco \
            -v "$PWD/platform/falco/aegis-runtime-write.yaml:/etc/falco/rules.d/aegis-runtime-write.yaml:ro" \
            falcosecurity/falco:0.45.0 \
            --validate /etc/falco/rules.d/aegis-runtime-write.yaml

      - name: Validate Kustomize build output
        working-directory: IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops
        run: |
          set -euo pipefail
          kubectl kustomize platform/kubernetes >/tmp/aegis-phase4-kustomize.yaml
          kubectl kustomize platform/falco >/tmp/aegis-phase4-falco-configmap.yaml
          test -s /tmp/aegis-phase4-kustomize.yaml
          test -s /tmp/aegis-phase4-falco-configmap.yaml

  unified-pss-gatekeeper:
    name: Unified PSS and Gatekeeper admission matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl 1.33.4
        run: |
          set -euo pipefail
          curl -fsSLO https://dl.k8s.io/release/v1.33.4/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.33.4/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Kind 0.33.0
        run: |
          set -euo pipefail
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o kind
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: Create disposable Kubernetes 1.33.12 cluster
        run: |
          set -euo pipefail
          kind create cluster \
            --name aegis-phase4-ci \
            --image kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4 \
            --wait 5m
          kubectl get nodes -o wide

      - name: Install Gatekeeper 3.23.1
        run: |
          set -euo pipefail
          kubectl apply -f https://raw.githubusercontent.com/open-policy-agent/gatekeeper/v3.23.1/deploy/gatekeeper.yaml
          kubectl wait \
            --for=condition=Available \
            deployment/gatekeeper-controller-manager \
            -n gatekeeper-system \
            --timeout=180s

      - name: Apply Phase 2 templates and Phase 4 unified constraints
        working-directory: IAM-Least-Privilege-Automation/phase5-7-policy-hardening
        run: |
          set -euo pipefail
          PHASE2=phase2-advanced/kubernetes/gatekeeper
          PHASE4=phase4-soar-gitops/platform/kubernetes

          kubectl apply -f "$PHASE4/namespaces.yaml"
          kubectl apply -f "$PHASE2/container-security-template.yaml"
          kubectl apply -f "$PHASE2/image-integrity-template.yaml"

          kubectl wait --for=condition=Established \
            crd/k8saegiscontainersecurity.constraints.gatekeeper.sh --timeout=120s
          kubectl wait --for=condition=Established \
            crd/k8saegisimageintegrity.constraints.gatekeeper.sh --timeout=120s

          kubectl apply -f "$PHASE4/unified-gatekeeper-constraints.yaml"
          sleep 8
          kubectl get k8saegiscontainersecurity,k8saegisimageintegrity

      - name: Secure Pod must pass both controls
        working-directory: IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops
        run: |
          set -euo pipefail
          kubectl apply --dry-run=server \
            -f platform/kubernetes/unified-policy-test/positive-pod.yaml

      - name: Native PSS must reject privileged Pod
        working-directory: IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops
        run: |
          set -euo pipefail
          set +e
          output=$(kubectl apply --dry-run=server \
            -f platform/kubernetes/unified-policy-test/negative-pss-privileged.yaml 2>&1)
          rc=$?
          set -e
          echo "$output"
          if [ "$rc" -eq 0 ] || ! echo "$output" | grep -Fq "violates PodSecurity"; then
            echo "ERROR: restricted PSS did not reject the privileged Pod."
            exit 1
          fi

      - name: Gatekeeper must reject writable root filesystem
        working-directory: IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops
        run: |
          set -euo pipefail
          set +e
          output=$(kubectl apply --dry-run=server \
            -f platform/kubernetes/unified-policy-test/negative-gatekeeper-readonly.yaml 2>&1)
          rc=$?
          set -e
          echo "$output"
          if [ "$rc" -eq 0 ] || ! echo "$output" | grep -Fq "readOnlyRootFilesystem=true"; then
            echo "ERROR: Gatekeeper did not reject writable root filesystem."
            exit 1
          fi

      - name: Gatekeeper must reject image without SHA-256 digest
        working-directory: IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops
        run: |
          set -euo pipefail
          set +e
          output=$(kubectl apply --dry-run=server \
            -f platform/kubernetes/unified-policy-test/negative-gatekeeper-image.yaml 2>&1)
          rc=$?
          set -e
          echo "$output"
          if [ "$rc" -eq 0 ] || ! echo "$output" | grep -Fq "explicit sha256 digest"; then
            echo "ERROR: Gatekeeper did not reject the tag-only image."
            exit 1
          fi

      - name: Kubernetes diagnostics
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -n gatekeeper-system -o wide || true
          kubectl get constrainttemplates || true
          kubectl get k8saegiscontainersecurity,k8saegisimageintegrity -o yaml || true

  container-image:
    if: github.event_name == 'push'
    name: Build, scan and attest SOAR image
    needs:
      - source-validation
      - unified-pss-gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve immutable Python base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          BASE_TAG="3.12.16-alpine3.24"
          BASE_REPOSITORY="library/python"
          TOKEN_JSON="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL --get \
            --data-urlencode "service=registry.docker.io" \
            --data-urlencode "scope=repository:${BASE_REPOSITORY}:pull" \
            https://auth.docker.io/token)"
          BASE_TOKEN="$(jq -er '.token' <<< "$TOKEN_JSON")"
          BASE_DIGEST="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsSI \
            -H "Authorization: Bearer ${BASE_TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://registry-1.docker.io/v2/${BASE_REPOSITORY}/manifests/${BASE_TAG}" \
            | awk 'BEGIN { IGNORECASE=1 } tolower($1) == "docker-content-digest:" { gsub("\\r", "", $2); print $2; exit }')"
          [[ "$BASE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          BASE_IMAGE="python:${BASE_TAG}@${BASE_DIGEST}"
          echo "image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Resolved build base: ${BASE_IMAGE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: IAM-Least-Privilege-Automation/phase5-7-policy-hardening/phase4-soar-gitops
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PYTHON_BASE_IMAGE=${{ steps.base.outputs.image }}
            VCS_REF=${{ github.sha }}
          tags: ghcr.io/serra-valle/aegis-soar:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Aegis SOAR
            org.opencontainers.image.source=https://github.com/serra-valle/Cybersecurity-portfolio
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Smoke-test published image under runtime restrictions
        shell: bash
        env:
          IMAGE: ghcr.io/serra-valle/aegis-soar
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            container="aegis-soar-smoke-$arch"
            port=18080
            if [[ "$arch" == "arm64" ]]; then port=18081; fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker pull --platform "linux/$arch" "$IMAGE@$DIGEST"
            docker run -d --name "$container" --platform "linux/$arch" --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m --cap-drop ALL --security-opt no-new-privileges -p "127.0.0.1:$port:8080" "$IMAGE@$DIGEST"
            trap 'docker rm -f aegis-soar-smoke-amd64 aegis-soar-smoke-arm64 >/dev/null 2>&1 || true' EXIT

            image_user="$(docker inspect --format '{{.Config.User}}' "$container")"
            [[ "$image_user" == "10001:10001" ]]

            health_code=""
            for attempt in $(seq 1 30); do
              health_code="$(curl -sS -o "/tmp/aegis-healthz-$arch.json" -w '%{http_code}' "http://127.0.0.1:$port/healthz" 2>/dev/null || true)"
              [[ "$health_code" == "200" ]] && break
              sleep 1
            done
            if [[ "$health_code" != "200" ]]; then
              docker logs "$container" || true
              echo "ERROR: $arch /healthz did not return HTTP 200."
              exit 1
            fi
            jq -e '.status == "ok"' "/tmp/aegis-healthz-$arch.json"

            ready_code="$(curl -sS -o "/tmp/aegis-readyz-$arch.json" -w '%{http_code}' "http://127.0.0.1:$port/readyz")"
            [[ "$ready_code" == "503" ]]
            jq -e '.detail == "HMAC secret is unavailable"' "/tmp/aegis-readyz-$arch.json"
            docker rm -f "$container" >/dev/null
          done

      - name: Install verified Trivy scanner
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.76.2"
          ARCHIVE="trivy_${VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/${ARCHIVE}"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_checksums.txt"
          grep "  ${ARCHIVE}$" "trivy_${VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "${ARCHIVE}" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Generate full Trivy reports for both architectures
        shell: bash
        env:
          IMAGE: ghcr.io/serra-valle/aegis-soar
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          for arch in amd64 arm64; do
            platform="linux/$arch"
            report="trivy-image-results-$arch.json"
            trivy image --image-src remote --platform "$platform" --scanners vuln,misconfig,secret --format json --output "$report" "$IMAGE@$DIGEST"
            jq -r --arg arch "$arch" '
              [.Results[]? | .Vulnerabilities[]?] as $all |
              "### Trivy scan: linux/\($arch)",
              "Vulnerability instances (all severities): \($all | length)",
              "Unique CVEs (all severities): \($all | map(.VulnerabilityID) | unique | length)",
              "UNKNOWN: \($all | map(select(.Severity == \"UNKNOWN\")) | length)",
              "LOW: \($all | map(select(.Severity == \"LOW\")) | length)",
              "MEDIUM: \($all | map(select(.Severity == \"MEDIUM\")) | length)",
              "HIGH: \($all | map(select(.Severity == \"HIGH\")) | length)",
              "CRITICAL: \($all | map(select(.Severity == \"CRITICAL\")) | length)",
              "HIGH/CRITICAL with a published fix: \($all | map(select((.Severity == \"HIGH\" or .Severity == \"CRITICAL\") and ((.FixedVersion // "") != "")) | length)",
              "HIGH/CRITICAL without a published fix: \($all | map(select((.Severity == \"HIGH\" or .Severity == \"CRITICAL\") and ((.FixedVersion // "") == "")) | length)"
            ' "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Fail on fixable HIGH/CRITICAL findings on both architectures
        shell: bash
        env:
          IMAGE: ghcr.io/serra-valle/aegis-soar
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "Enforcing Trivy gate for linux/$arch"
            trivy image --image-src remote --platform "linux/$arch" --ignore-unfixed --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 "$IMAGE@$DIGEST"
          done

      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-soar-trivy-report-${{ github.sha }}
          path: |
            trivy-image-results-amd64.json
            trivy-image-results-arm64.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/serra-valle/aegis-soar
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image reference
        shell: bash
        env:
          IMAGE: ghcr.io/serra-valle/aegis-soar
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE_IMAGE: ${{ steps.base.outputs.image }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "### Aegis SOAR image published"
            printf -- '- Immutable image: `%s@%s`\n' "$IMAGE" "$DIGEST"
            printf -- '- Build base: `%s`\n' "$BASE_IMAGE"
            printf -- '- Architectures: `linux/amd64, linux/arm64`\n'
            printf '%s\n' "- Runtime smoke tests: passed on amd64 and arm64 with non-root, read-only root filesystem, no capabilities, and no-new-privileges"
            printf '%s\n' "- SBOM and signed provenance: attached"
            printf '%s\n' "- Trivy: fixable HIGH/CRITICAL findings fail the job on both architectures; full reports are retained"
          } >> "$GITHUB_STEP_SUMMARY"
